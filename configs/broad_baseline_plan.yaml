planning:
  name: broad_coral_fish_global_pretraining_v3
  # Global supply drives pretraining selection. Local relevance is handled during
  # the later Indonesia/SeaLens adaptation stage.
  region_name: Global pretraining (Indonesia counts disabled)
  region_place_id: 6966
  collect_regional_counts: false
  require_regional_threshold: false
  quality_grade: research
  photos_only: true
  exclude_captive: true
  photo_license_codes: [cc0, cc-by, cc-by-sa]
  min_regional_observations: 0
  # A 250-observation floor plus the expanded marine family set plans roughly
  # 150 train species. The pilot yield projects only ~87 accepted independent
  # observations at this floor, so targets are progressive rather than pretending
  # every class can reach 200-300 from iNaturalist alone.
  min_global_observations: 250
  expected_acceptance_rate: 0.346
  min_broad_train_species: 150
  accepted_target_tiers:
    - {min_global_observations: 250, target_accepted_observations: 100}
    - {min_global_observations: 600, target_accepted_observations: 200}
    - {min_global_observations: 900, target_accepted_observations: 300}
  novel_evaluation_accepted_target: 100
  max_species_per_scientist_family: 15
  max_species_per_genus: 4
  novel_evaluation_fraction: 0.15
  random_seed: 42
  per_page: 500
  max_pages: 10
  retries: 5
  sleep_seconds: 0.0
  target_species_file: species.txt
  output_dir: plans/broad_coral_global_v3

# `scientist_family` is the stable label shown to scientists. `inat_taxa`
# contains the current iNaturalist taxa that must be queried to populate it.
# Confirmed crosswalk:
# - Scaridae/parrotfishes are included by the current Labridae taxon.
# - Caesionidae/fusiliers are included by the current Lutjanidae taxon.
# - Anthiadidae is distinct and is included as its own family.
# - Epinephelidae is included with Serranidae so the requested grouper species
#   are not silently omitted by current iNaturalist taxonomy.
# All configured iNaturalist names and IDs below were resolved as active family
# taxa on 2026-08-12. This v3 scope is marine/coral-first; it adds no freshwater
# families merely to inflate the class count.
families:
  - scientist_family: Acanthuridae
    inat_taxa:
